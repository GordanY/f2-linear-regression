<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一條線，看趨勢 | Find the trend</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 80 80%27%3E%3Crect width=%2780%27 height=%2780%27 rx=%2716%27 fill=%27%23086c61%27/%3E%3Cpath d=%27M15 60L65 20%27 stroke=%27white%27 stroke-width=%276%27/%3E%3C/svg%3E">
<style>
:root{--ink:#173c43;--muted:#526b70;--green:#086c61;--pale:#e7f3ef;--orange:#b65320;--line:#ccdad8}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC",sans-serif;line-height:1.6}header,main,footer{max-width:1140px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:clamp(26px,4vw,42px);line-height:1.2;margin:6px 0}h2{font-size:24px;margin:0 0 12px}h3{margin:0 0 8px}p{margin:8px 0 16px}.eyebrow{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.08em}button,input,select{font:inherit}button,select,input{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:white;color:var(--ink)}button{cursor:pointer;min-height:44px}button:hover{background:var(--pale)}button:focus-visible,select:focus-visible,input:focus-visible,svg:focus-visible{outline:3px solid #c77736;outline-offset:3px}button.primary,nav button[aria-current=step]{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:default}nav{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}nav button{flex:1;min-width:180px;text-align:left}nav small{display:block;font-weight:400}.layout{display:grid;grid-template-columns:1fr 330px;gap:22px}.panel{border:1px solid var(--line);border-radius:18px;padding:24px;background:white}.chart-panel{min-width:0}.note{background:var(--pale);border-radius:12px;padding:15px;margin:16px 0}.equation{font-size:29px;font-weight:750;line-height:1.4;font-variant-numeric:tabular-nums}.metric{padding:12px 0;border-bottom:1px solid var(--line)}.metric strong{font-size:20px;display:block}.subtle{color:var(--muted);font-size:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row label{flex:1;min-width:90px}.row input{width:100%}select{width:100%;margin:6px 0 12px}.graph{display:block;width:100%;height:auto;touch-action:manipulation}.legend{display:flex;gap:20px;font-size:14px;flex-wrap:wrap}.dot{color:var(--green)}.fit{color:var(--orange)}details{margin-top:16px}summary{cursor:pointer;padding:8px 0}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}td button{padding:2px 10px}#status{min-height:26px;color:var(--green)}.prompt{font-weight:650}.badge{background:#fff0e5;color:#853b17;padding:5px 10px;border-radius:8px;display:inline-block}footer{font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}header{align-items:flex-start}header,main,footer{padding:16px}.panel{padding:18px}nav button{min-width:120px;font-size:14px}.equation{font-size:25px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head>
<body><header><div><div class="eyebrow" data-t="eyebrow"></div><h1 data-t="title"></h1><div data-t="subtitle"></div></div><button id="language" aria-label="Switch to English">English</button></header>
<main><nav aria-label="Activity steps" id="steps"></nav><section class="layout"><div class="panel chart-panel"><h2 id="heading"></h2><p id="intro"></p><div id="presetBox"><label for="preset" data-t="choose"></label><select id="preset"></select><button id="load" class="primary" data-t="load"></button></div><div id="scenario" class="note" hidden></div><svg id="graph" class="graph" viewBox="0 0 680 430" role="img" aria-labelledby="graphTitle graphDesc"><title id="graphTitle"></title><desc id="graphDesc"></desc></svg><div class="legend"><span class="dot" data-t="dots"></span><span class="fit" data-t="line"></span><span id="predictionLegend" hidden data-t="predLegend"></span></div><p id="axisNote" class="subtle"></p><div id="editBox" hidden><p class="prompt" data-t="editHint"></p><div class="row"><label><span data-t="xcoord"></span><input id="pointX" type="number" step="any" value="5"></label><label><span data-t="ycoord"></span><input id="pointY" type="number" step="any" value="15"></label><button id="add" class="primary" data-t="add"></button></div><div class="row" style="margin-top:12px"><button id="undo" data-t="undo"></button><button id="reset" data-t="reset"></button><button id="clear" data-t="clear"></button></div><p class="subtle" data-t="limits"></p></div><div id="predictBox" hidden><label for="predictX" data-t="predictLabel"></label><div class="row"><input id="predictX" type="number" min="0" max="100" step="1" value="18" style="width:110px"><button id="predict" class="primary" data-t="predict"></button></div><div id="prediction" class="note" aria-live="polite"></div><p class="prompt" data-t="predictPrompt"></p></div><div id="status" role="status" aria-live="polite"></div><details><summary data-t="viewData"></summary><table><thead><tr><th>x</th><th>y</th><th id="actionHead"></th></tr></thead><tbody id="dataRows"></tbody></table></details></div><aside class="panel"><h3 data-t="model"></h3><div id="equation" class="equation" aria-live="polite"></div><div class="metric"><strong id="m"></strong><span data-t="mExplain"></span></div><div class="metric"><strong id="c"></strong><span data-t="cExplain"></span></div><p id="units" class="subtle"></p><div class="note"><strong data-t="ideaTitle"></strong><p data-t="idea" style="margin-bottom:0"></p></div><p id="question" class="prompt"></p><p data-t="caution" class="subtle"></p><button id="next" class="primary"></button></aside></section></main><footer><p data-t="footer"></p><a href="worksheet.pdf" data-t="worksheet" style="color:var(--green)"></a></footer>
<script>
'use strict';
const copy={zh:{worksheet:'下載雙語工作紙（PDF）',eyebrow:'60 分鐘・線性回歸初探',title:'一條線，看趨勢',subtitle:'選數據 → 改變點 → 作預測',step:['1 選擇數據','2 改變數據點','3 生活中的預測'],time:['15 分鐘','20 分鐘','15 分鐘'],heading:['數據有甚麼趨勢？','一個新點，可以改變整條線嗎？','校園義賣：印製襟章的成本'],intro:['選擇一組數據並載入，觀察散點和最佳擬合直線。所有數據均為教學模擬數據；每點代表獨立的觀察或測試。','沿用步驟 1 的數據。點一下圖內空白位置，或輸入座標加入數據點，觀察直線如何改變。','先在圖上估計答案，再按「顯示預測」比較。這些是模擬的印製報價，不是真實商店價格。'],choose:'選擇數據',load:'載入數據',dots:'● 數據點',line:'━ 最佳擬合直線',predLegend:'◆ 預測值',model:'我們的直線模型',mExplain:'m：x 每增加 1，直線上的 y 改變多少。',cExplain:'c：當 x = 0 時，直線上的 y 值（初始值）。',ideaTitle:'甚麼是線性回歸？',idea:'用一條直線概括數據的整體趨勢。它是整體最貼近數據的直線，不一定通過每一個點。',caution:'直線是一個模型。c 的實際意義取決於情境；x = 0 若在數據範圍外，這個初始值也可能只是估計。',editHint:'先猜一猜：在直線上方加一個點，會發生甚麼事？',xcoord:'x 座標',ycoord:'y 座標',add:'加入點',undo:'復原',reset:'重設這組數據',clear:'清除所有點',limits:'座標範圍：−100 至 100；最多 60 個點。亦可在下方表格刪除個別點。',viewData:'查看數據表',remove:'刪除',predictLabel:'印製數量 x（0–100 個襟章）',predict:'顯示預測',predictPrompt:'比較 18 個和 50 個的預測：哪個較值得信賴？為甚麼？',scenario:'x = 襟章數量（個）；y = 總成本（港元）。報價數據：0、5、10、15、20 個。當數量為 0 時，仍有基本設置費。',question:['哪組數據的 m 是正數、負數或接近 0？','比較前後的 m 和 c。遠離其他點的新點，影響是否較大？','m 和 c 在這個情境中各代表甚麼？'],next:['前往步驟 2 →','前往步驟 3 →','回到步驟 1 ↺'],footer:'課堂用模擬數據 • 無需帳戶 • 所有操作在你的瀏覽器內完成，不會傳送數據。開場及總結共 10 分鐘。',undefined:'未能擬合直線',need:'至少需要兩個不同 x 值的數據點。',added:'已加入數據點。',loaded:'已載入數據。',invalid:'請輸入 −100 至 100 的有效座標；最多 60 個點。',predInvalid:'請輸入 0 至 100 的整數。',within:'在已觀察的數據範圍內：仍是估計，並非保證。',outside:'超出已觀察的數據範圍：這是外推，可能較不可靠。',estimate:'預測總成本：約 HK$',at:'當 x =',axis:'圖的刻度會隨數據自動調整。',graph:'散點圖與最佳擬合直線',count:'個數據點',trend:'模型',initial:'目前數據',noData:'沒有數據點。'},en:{worksheet:'Download bilingual worksheet (PDF)',eyebrow:'60 MINUTES · LINEAR REGRESSION',title:'Find the trend',subtitle:'Choose data → Change points → Make a prediction',step:['1 Choose data','2 Change points','3 Predict in real life'],time:['15 minutes','20 minutes','15 minutes'],heading:['What trend do you notice?','Can one new point change the whole line?','School fair: printing badges'],intro:['Choose and load a dataset. Look at the dots and the best-fit line. All datasets are simulated for learning; each dot is a separate observation or trial.','Keep the data from Step 1. Click an empty place inside the graph, or enter coordinates to add a point. Watch the line change.','Estimate from the graph first, then select “Show prediction” to compare. These are simulated printing quotes, not real shop prices.'],choose:'Choose a dataset',load:'Load data',dots:'● Data points',line:'━ Best-fit line',predLegend:'◆ Predicted value',model:'Our straight-line model',mExplain:'m: the change in y on the line when x increases by 1.',cExplain:'c: the value of y on the line when x = 0 (initial value).',ideaTitle:'What is linear regression?',idea:'A way to summarise the overall trend of data with a straight line. The line fits the data as a whole; it need not pass through every dot.',caution:'A line is a model. The meaning of c depends on the situation; if x = 0 is outside the data range, the initial value may also be only an estimate.',editHint:'Predict first: what happens if you add a point above the line?',xcoord:'x coordinate',ycoord:'y coordinate',add:'Add point',undo:'Undo',reset:'Reset this dataset',clear:'Clear all points',limits:'Coordinates: −100 to 100; up to 60 points. You can also remove individual points in the table below.',viewData:'View data table',remove:'Remove',predictLabel:'Quantity x (0–100 badges)',predict:'Show prediction',predictPrompt:'Compare predictions for 18 and 50 badges. Which is more trustworthy? Why?',scenario:'x = number of badges; y = total cost (HK$). Quotes cover 0, 5, 10, 15 and 20 badges. At quantity 0, there is still a basic setup fee.',question:['Which dataset has positive, negative or nearly zero m?','Compare m and c before and after. Does a point far from the others have more influence?','What do m and c mean in this situation?'],next:['Go to Step 2 →','Go to Step 3 →','Return to Step 1 ↺'],footer:'Simulated classroom data • No account needed • Everything runs in your browser; no data is sent. Allow 10 minutes for opening and reflection.',undefined:'No unique best-fit line',need:'Use at least two points with different x values.',added:'Point added.',loaded:'Data loaded.',invalid:'Enter valid coordinates from −100 to 100; maximum 60 points.',predInvalid:'Enter a whole number from 0 to 100.',within:'Within the observed range: still an estimate, not a guarantee.',outside:'Outside the observed range: this is extrapolation and may be less reliable.',estimate:'Estimated total cost: about HK$',at:'At x =',axis:'The graph scale adjusts automatically to the data.',graph:'Scatter plot and best-fit line',count:'data points',trend:'Model',initial:'Current data',noData:'No data points.'}};
const datasets=[{names:['A 外送距離與收費','A Delivery distance and fee'],axes:[['距離（公里）','收費（港元）'],['Distance (km)','Fee (HK$)']],units:['m：港元／公里；c：港元','m: HK$ per km; c: HK$'],points:[[0,12],[1,9],[2,22],[3,13],[4,26],[5,22],[6,35],[7,26],[8,42],[9,34],[10,43]]},{names:['B 蠟燭燃燒時間與高度','B Candle burning time and height'],axes:[['時間（小時）','高度（厘米）'],['Time (hours)','Height (cm)']],units:['m：厘米／小時；c：厘米','m: cm per hour; c: cm'],points:[[0,21],[0.5,18],[1,20],[1.5,14],[2,18],[2.5,12],[3,15],[3.5,10],[4,13],[4.5,7],[5,10]]},{names:['C 課室時間與溫度','C Classroom time and temperature'],axes:[['時間（小時）','溫度（°C）'],['Time (hours)','Temperature (°C)']],units:['m：°C／小時；c：°C','m: °C per hour; c: °C'],points:[[0,24],[0.5,22],[1,25],[1.5,23],[2,22],[2.5,25],[3,24],[3.5,22],[4,24],[4.5,23],[5,24]]}];
const badgeData=[[0,20],[5,36],[10,49],[15,64],[20,81]];
let lang='zh',step=0,active=0,points=datasets[0].points.map(p=>[...p]),history=[],predictionX=null;
const $=id=>document.getElementById(id),clone=a=>a.map(p=>[...p]),t=k=>copy[lang][k],fmt=n=>{const v=Math.abs(n)<.0005?0:n;return Number(v.toFixed(2)).toString()};
function fit(data){if(data.length<2)return null;let mx=data.reduce((s,p)=>s+p[0],0)/data.length,my=data.reduce((s,p)=>s+p[1],0)/data.length;let den=data.reduce((s,p)=>s+(p[0]-mx)**2,0);if(den<1e-12)return null;let m=data.reduce((s,p)=>s+(p[0]-mx)*(p[1]-my),0)/den;return {m,c:my-m*mx}}
function equation(f){return `y = ${fmt(f.m)}x ${f.c<0?'−':'+'} ${fmt(Math.abs(f.c))}`}
function current(){return step===2?badgeData:points}
function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=lang==='zh'?'一條線，看趨勢':'Find the trend';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('language').textContent=lang==='zh'?'English':'繁體中文';$('language').setAttribute('aria-label',lang==='zh'?'Switch to English':'切換至繁體中文');$('steps').setAttribute('aria-label',lang==='zh'?'活動步驟':'Activity steps');$('steps').innerHTML='';for(let i=0;i<3;i++){let b=document.createElement('button');b.textContent=t('step')[i];let sm=document.createElement('small');sm.textContent=t('time')[i];b.append(sm);if(step===i)b.setAttribute('aria-current','step');b.onclick=()=>{step=i;predictionX=null;$('status').textContent='';render()};$('steps').append(b)}$('heading').textContent=t('heading')[step];$('intro').textContent=t('intro')[step];$('presetBox').hidden=step!==0;$('editBox').hidden=step!==1;$('predictBox').hidden=step!==2;$('scenario').hidden=step!==2;$('scenario').textContent=t('scenario');$('preset').innerHTML=datasets.map((d,i)=>`<option value="${i}">${d.names[lang==='zh'?0:1]}</option>`).join('');$('preset').value=active;$('question').textContent=t('question')[step];$('next').textContent=t('next')[step];$('axisNote').textContent=t('axis');$('units').textContent=step===2?(lang==='zh'?'m：港元／個；c：港元':'m: HK$ per badge; c: HK$'):datasets[active].units[lang==='zh'?0:1];$('undo').disabled=!history.length;$('actionHead').textContent=step===1?t('remove'):'';let f=fit(current());$('equation').textContent=f?equation(f):t('undefined');$('m').textContent=f?`m = ${fmt(f.m)}`:'m = —';$('c').textContent=f?`c = ${fmt(f.c)}`:'c = —';$('dataRows').innerHTML='';current().forEach((p,i)=>{let tr=document.createElement('tr');for(let v of p){let td=document.createElement('td');td.textContent=fmt(v);tr.append(td)}let td=document.createElement('td');if(step===1){let b=document.createElement('button');b.textContent=t('remove');b.setAttribute('aria-label',`${t('remove')} (${fmt(p[0])}, ${fmt(p[1])})`);b.onclick=()=>{save();points.splice(i,1);render()};td.append(b)}tr.append(td);$('dataRows').append(tr)});draw();showPrediction()}
let plot=null;
function draw(){const mobile=$('graph').clientWidth<460,width=mobile?Math.max(280,$('graph').clientWidth):680,height=mobile?320:430;$('graph').setAttribute('viewBox',`0 0 ${width} ${height}`);const data=current(),f=fit(data),li=lang==='zh'?0:1;let axes=step===2?(li===0?['襟章數量（個）','總成本（港元）']:['Number of badges','Total cost (HK$)']):datasets[active].axes[li];let xs=data.map(p=>p[0]),ys=data.map(p=>p[1]);if(predictionX!==null&&f){xs.push(predictionX);ys.push(f.m*predictionX+f.c)}let xmin=Math.min(0,...xs),xmax=Math.max(1,...xs),ymin=Math.min(0,...ys),ymax=Math.max(1,...ys);const nice=v=>{let p=10**Math.floor(Math.log10(v)),r=v/p;return (r<=1?1:r<=2?2:r<=5?5:10)*p};const xstep=nice((xmax-xmin)/(mobile?3:5)),ystep=nice((ymax-ymin)/(mobile?3:5));xmin=Math.floor(xmin/xstep)*xstep-xstep;xmax=Math.ceil(xmax/xstep)*xstep+xstep;ymin=Math.floor(ymin/ystep)*ystep-ystep;ymax=Math.ceil(ymax/ystep)*ystep+ystep;const left=mobile?48:72,right=width-(mobile?18:25),top=35,bottom=height-65;const X=x=>left+(x-xmin)/(xmax-xmin)*(right-left),Y=y=>bottom-(y-ymin)/(ymax-ymin)*(bottom-top);plot={left,right,top,bottom,xmin,xmax,ymin,ymax};let html=`<title id="graphTitle">${t('graph')}</title><desc id="graphDesc">${axes.join('; ')}. ${data.length} ${t('count')}. ${f?equation(f):t('need')}</desc><defs><clipPath id="clip"><rect x="${left}" y="${top}" width="${right-left}" height="${bottom-top}"/></clipPath></defs><rect x="${left}" y="${top}" width="${right-left}" height="${bottom-top}" fill="#fafcfb" stroke="#ccdad8"/>`;
for(let x=xmin;x<=xmax+xstep*.01;x+=xstep){html+=`<path d="M ${X(x)} ${top} V ${bottom}" stroke="#e0e8e5"/><text x="${X(x)}" y="${bottom+24}" text-anchor="middle" font-size="13" fill="#526b70">${fmt(x)}</text>`}for(let y=ymin;y<=ymax+ystep*.01;y+=ystep){html+=`<path d="M ${left} ${Y(y)} H ${right}" stroke="#e0e8e5"/><text x="${left-10}" y="${Y(y)+4}" text-anchor="end" font-size="13" fill="#526b70">${fmt(y)}</text>`}
html+=`<path d="M ${X(0)} ${top} V ${bottom} M ${left} ${Y(0)} H ${right}" stroke="#829c99"/><g clip-path="url(#clip)">`;if(f)html+=`<path d="M ${X(xmin)} ${Y(f.m*xmin+f.c)} L ${X(xmax)} ${Y(f.m*xmax+f.c)}" stroke="#b65320" stroke-width="3" fill="none"/>`;for(let p of data)html+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="6" fill="#086c61" stroke="white" stroke-width="2"><title>(${fmt(p[0])}, ${fmt(p[1])})</title></circle>`;if(predictionX!==null&&f){let x=X(predictionX),y=Y(f.m*predictionX+f.c);html+=`<path d="M ${x} ${bottom} V ${y} H ${left}" stroke="#6b51a3" stroke-dasharray="5 4" fill="none"/><path d="M ${x} ${y-8} L ${x+8} ${y} L ${x} ${y+8} L ${x-8} ${y} Z" fill="#6b51a3"/>`}
html+=`</g><text x="${(left+right)/2}" y="${bottom+56}" text-anchor="middle" font-size="14" fill="#173c43">${axes[0]}</text><text x="${left}" y="21" font-size="14" fill="#173c43">${axes[1]}</text>`;if(!f)html+=`<text x="${(left+right)/2}" y="180" text-anchor="middle" font-size="16" fill="#173c43">${data.length?t('need'):t('noData')}</text>`;$('graph').innerHTML=html;$('graph').style.cursor=step===1?'crosshair':'default'}
function save(){history.push(clone(points));if(history.length>100)history.shift()}
function addPoint(x,y){if(!Number.isFinite(x)||!Number.isFinite(y)||Math.abs(x)>100||Math.abs(y)>100||points.length>=60){$('status').textContent=t('invalid');return}save();points.push([x,y]);render();$('status').textContent=t('added')}
function showPrediction(){let visible=step===2&&predictionX!==null;$('prediction').hidden=!visible;$('predictionLegend').hidden=!visible;if(visible){const f=fit(badgeData);$('prediction').textContent=`${t('at')} ${predictionX}: ${t('estimate')}${(f.m*predictionX+f.c).toFixed(2)}. ${predictionX>20?t('outside'):t('within')}`}}
$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';$('status').textContent='';render()};$('load').onclick=()=>{active=Number($('preset').value);points=clone(datasets[active].points);history=[];render();$('status').textContent=t('loaded')};$('next').onclick=()=>{step=(step+1)%3;predictionX=null;$('status').textContent='';render();$('heading').scrollIntoView({block:'start'})};$('add').onclick=()=>{if($('pointX').value.trim()===''||$('pointY').value.trim()===''){$('status').textContent=t('invalid');return}addPoint(Number($('pointX').value),Number($('pointY').value))};$('undo').onclick=()=>{if(history.length){points=history.pop();render()}};$('reset').onclick=()=>{save();points=clone(datasets[active].points);render()};$('clear').onclick=()=>{save();points=[];render()};$('graph').onclick=e=>{if(step!==1)return;let svg=$('graph'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let q=pt.matrixTransform(svg.getScreenCTM().inverse());if(q.x<plot.left||q.x>plot.right||q.y<plot.top||q.y>plot.bottom)return;addPoint(Number((plot.xmin+(q.x-plot.left)/(plot.right-plot.left)*(plot.xmax-plot.xmin)).toFixed(1)),Number((plot.ymin+(plot.bottom-q.y)/(plot.bottom-plot.top)*(plot.ymax-plot.ymin)).toFixed(1)))};$('predict').onclick=()=>{let raw=$('predictX').value,x=Number(raw);if(!raw.trim()||!Number.isInteger(x)||x<0||x>100){$('status').textContent=t('predInvalid');return}predictionX=x;$('status').textContent='';render()};window.addEventListener('resize',()=>draw());render();
</script></body></html>
